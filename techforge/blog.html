<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Buying Guides & PC Tips | TechForge India</title>
<meta name="description" content="Buying guides, build tutorials and hardware comparisons from TechForge India — learn before you shop.">
<link rel="canonical" href="https://www.techforge.example.in/blog.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header glass">
  <div class="container nav-row">
    <a href="index.html" class="flex items-center gap-2"><span class="neu-sm" style="padding:.5rem;display:inline-flex">🖥️</span><span class="logo">TECH<span>FORGE</span></span></a>
    <nav class="flex items-center gap-3">
      <a href="store.html" class="neu-btn">Shop</a>
      <button class="neu-btn cart-btn" onclick="toggleCartDrawer(true)">🛒<span class="cart-count hidden" data-cart-count>0</span></button>
    </nav>
  </div>
</header>

<main class="container py-8">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span>Blog</span></div>
  <h1 class="font-black mb-2" style="font-size:1.9rem">TechForge Blog</h1>
  <p class="text-muted mb-8">Buying guides, build tutorials and honest comparisons — written to help you shop smarter.</p>
  <div class="product-grid" id="blogGrid"></div>
</main>

<footer class="site-footer">
  <div class="container text-center text-muted">&copy; 2026 TechForge India. All rights reserved.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  document.getElementById('blogGrid').innerHTML = BLOG_POSTS.map(b=>`
    <a class="neu-card blog-card" href="blog-post.html?slug=${b.slug}">
      <img src="${b.cover}" alt="${b.title}" loading="lazy">
      <div class="blog-meta">${b.category} · ${b.readTime} · ${new Date(b.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>
      <h2 class="font-black" style="font-size:1.1rem">${b.title}</h2>
      <p class="text-muted text-sm mt-2 line-clamp-2">${b.excerpt}</p>
    </a>`).join('');
</script>
</body>
</html>
