<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | TechForge India</title>
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="marquee-strip"><div class="marquee-track">
  <span>🔥 FESTIVE SALE: Use code <b>TECH10</b> for extra 10% off</span>
  <span>🚚 Free delivery pan-India on orders above ₹2,999</span>
  <span>💳 No-cost EMI available on all cards</span>
</div></div>
<header class="site-header glass">
  <div class="container nav-row">
    <a href="index.html" class="flex items-center gap-2"><span class="neu-sm" style="padding:.5rem;display:inline-flex">🖥️</span><span class="logo">TECH<span>FORGE</span></span></a>
    <nav class="flex items-center gap-3">
      <a href="store.html" class="neu-btn">← Continue Shopping</a>
    </nav>
  </div>
</header>

<main class="container py-8">
  <h1 class="font-black mb-8" style="font-size:1.9rem">Your Cart</h1>
  <div id="cartRoot"></div>
</main>

<footer class="site-footer">
  <div class="container text-center text-muted">&copy; 2026 TechForge India. All rights reserved.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  let appliedCoupon = null;

  function renderCartPage(){
    const cart = getCart();
    const root = document.getElementById('cartRoot');
    if(cart.length===0){
      root.innerHTML = `<div class="neu-card empty-state">Your cart is empty. <a href="store.html" class="text-indigo font-bold">Start shopping →</a></div>`;
      return;
    }
    const subtotal = cartSubtotal(cart);
    const discount = appliedCoupon ? appliedCoupon.discount : 0;
    const total = subtotal - discount;

    root.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:2rem" class="cart-flex">
      <div style="flex:2;display:flex;flex-direction:column;gap:1rem">
        ${cart.map(c=>`
          <div class="neu-card cart-line" style="align-items:center">
            <img src="${c.img}" alt="${c.title}">
            <div style="flex:1">
              <div class="font-bold">${c.title}</div>
              <div class="p-price mt-2">${fmtINR(c.price)}</div>
            </div>
            <div class="qty-stepper neu-in">
              <button onclick="updateCartQty('${c.id}',-1);renderCartPage()">−</button>
              <span class="font-black" style="padding:0 .5rem">${c.qty}</span>
              <button onclick="updateCartQty('${c.id}',1);renderCartPage()">+</button>
            </div>
            <div class="font-black" style="width:6rem;text-align:right">${fmtINR(c.price*c.qty)}</div>
            <button class="neu-btn danger-text" onclick="removeFromCart('${c.id}');renderCartPage()" aria-label="Remove">🗑️</button>
          </div>`).join('')}
      </div>
      <div style="flex:1">
        <div class="neu-card" style="padding:1.5rem">
          <h2 class="font-black mb-4" style="font-size:1.2rem">Order Summary</h2>
          <div style="display:flex;gap:.5rem;margin-bottom:1rem">
            <input id="couponInput" class="neu-in" placeholder="Coupon code" value="${appliedCoupon?appliedCoupon.code:''}">
            <button class="neu-btn" onclick="applyCouponClick()">Apply</button>
          </div>
          ${appliedCoupon?`<div class="text-success text-sm font-bold mb-2">✓ ${appliedCoupon.code} applied — ${appliedCoupon.label}</div>`:'<div class="text-muted text-sm mb-2">Try TECH10 or WELCOME500</div>'}
          <div class="summary-row"><span>Subtotal</span><span>${fmtINR(subtotal)}</span></div>
          <div class="summary-row"><span>Discount</span><span class="text-success">−${fmtINR(discount)}</span></div>
          <div class="summary-row"><span>Shipping</span><span class="text-success">Free</span></div>
          <div class="summary-total"><span>Total</span><span>${fmtINR(total)}</span></div>
          <a href="checkout.html" class="neu-btn primary block mt-6" style="padding:1rem">Proceed to Checkout →</a>
        </div>
      </div>
    </div>`;
  }

  function applyCouponClick(){
    const code = document.getElementById('couponInput').value;
    const result = applyCoupon(code, cartSubtotal());
    if(result.valid){ appliedCoupon = result; showToast('Coupon applied: '+result.label); lsSet('tf_active_coupon', result); }
    else showToast('Invalid coupon code', 'error');
    renderCartPage();
  }

  appliedCoupon = lsGet('tf_active_coupon', null);
  renderCartPage();
  var styleTag = document.createElement('style');
  styleTag.textContent = '@media(min-width:900px){.cart-flex{flex-direction:row !important}}';
  document.head.appendChild(styleTag);
</script>
</body>
</html>
