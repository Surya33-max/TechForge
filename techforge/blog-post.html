<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog | TechForge India</title>
<meta id="metaDesc" name="description" content="TechForge India blog.">
<link id="canonicalLink" rel="canonical" href="https://www.techforge.example.in/blog-post.html">
<link rel="stylesheet" href="css/style.css">
<script id="articleJsonLd" type="application/ld+json">{}</script>
</head>
<body>

<header class="site-header glass">
  <div class="container nav-row">
    <a href="index.html" class="flex items-center gap-2"><span class="neu-sm" style="padding:.5rem;display:inline-flex">🖥️</span><span class="logo">TECH<span>FORGE</span></span></a>
    <nav class="flex items-center gap-3">
      <a href="store.html" class="neu-btn">Shop</a>
      <button class="neu-btn cart-btn" onclick="toggleCartDrawer(true)">🛒<span class="cart-count hidden" data-cart-count>0</span></button>
    </nav>
  </div>
</header>

<main class="container py-8" style="max-width:820px" id="postRoot">
  <div class="breadcrumb" id="crumb"><a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span>Loading…</span></div>
</main>

<footer class="site-footer">
  <div class="container text-center text-muted">&copy; 2026 TechForge India. All rights reserved.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  const post = BLOG_POSTS.find(b=>b.slug===qs('slug'));
  const root = document.getElementById('postRoot');

  if(!post){
    root.innerHTML += `<div class="empty-state">Post not found. <a href="blog.html" class="text-indigo font-bold">Back to blog →</a></div>`;
  } else {
    document.title = post.title + ' | TechForge Blog';
    document.getElementById('pageTitle').textContent = post.title + ' | TechForge Blog';
    document.getElementById('metaDesc').setAttribute('content', post.metaDescription);
    document.getElementById('canonicalLink').setAttribute('href', 'https://www.techforge.example.in/blog-post.html?slug='+post.slug);
    document.getElementById('crumb').innerHTML = `<a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span>${post.title}</span>`;
    document.getElementById('articleJsonLd').textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"BlogPosting","headline":post.title,"image":post.cover,
      "datePublished":post.date,"author":{"@type":"Organization","name":post.author},
      "publisher":{"@type":"Organization","name":"TechForge India"},"description":post.metaDescription
    });

    const bodyHtml = post.body.map(block=>{
      if(block.h) return `<h2>${block.h}</h2>`;
      if(block.p) return `<p>${block.p}</p>`;
      if(block.ul) return `<ul>${block.ul.map(li=>`<li>${li}</li>`).join('')}</ul>`;
      return '';
    }).join('');

    root.innerHTML += `
      <span class="badge badge-indigo mt-4" style="display:inline-block">${post.category}</span>
      <h1 class="font-black mt-4" style="font-size:2rem;line-height:1.2">${post.title}</h1>
      <div class="text-muted text-sm mt-2">By ${post.author} · ${new Date(post.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} · ${post.readTime}</div>
      <img src="${post.cover}" alt="${post.title}" style="border-radius:20px;margin:2rem 0" class="neu-sm">
      <div class="prose">${bodyHtml}</div>
      <p class="text-xs text-muted mt-8"><b>Target keywords for this post:</b> ${post.keywords} <br>(Shown here for SEO-learning purposes — this line is normally hidden or kept in your CMS notes, not published.)</p>
      <div class="neu-card mt-8" style="padding:1.5rem;text-align:center">
        <h3 class="font-black">Ready to shop?</h3>
        <a href="store.html" class="neu-btn primary mt-4" style="display:inline-flex">Browse the Catalog →</a>
      </div>
    `;
  }
</script>
</body>
</html>
